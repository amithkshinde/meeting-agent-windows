# Builds the Windows installer on GitHub's own Windows machines, so you don't need a Windows PC.
#
# Two ways to use it:
#   1. Open the Actions tab, choose "Build Windows installer", then "Run workflow". GitHub builds the installer
#      and publishes it on the Releases page (tag windows-v<version>, taken from package.json).
#   2. Or push a tag that starts with "windows-v". The same thing happens.
name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['windows-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Continue'
          npm run build 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::tsc build failed"; exit 1 }
          $out = & npx electron-builder --win --x64 --publish never 2>&1 | Tee-Object -Variable log
          $log | Out-Host
          if ($LASTEXITCODE -ne 0) {
            $tail = ($log | Select-Object -Last 12 | ForEach-Object { "$_" }) -join ' | '
            Write-Host "::error title=electron-builder failed::$tail"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingAgent-Windows
          path: dist-installer/*.exe
      - name: Publish to Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "windows-v$version"
          $exe = Get-ChildItem dist-installer -Filter *.exe | Select-Object -First 1
          $notes = "Meeting Agent for Windows $version (64-bit, Windows 10 and 11). Download the .exe below and run it. Windows may show 'Windows protected your PC' because the app is not code-signed: click More info, then Run anyway. This version has not been tested on a real Windows PC yet, so please report anything that breaks at https://github.com/amithkshinde/meeting-agent-windows/issues"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe.FullName --clobber
          } else {
            gh release create $tag $exe.FullName --target "${{ github.sha }}" --title "Meeting Agent for Windows $version" --notes $notes --prerelease
          }
